<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Porta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: entrada com dois cards grandes; página por porta-voz com abas no topo; Alimentação fixa no canto superior direito; Eco em painel lateral. Tema claro único, por escolha. */
:root{
  --bg:#ffffff; --ink:#0B0829; --muted:#5f5d73; --line:#ECEAF1; --soft:#F6F6F9;
  --orange:#FF8400; --orange-soft:#FFF0DF;
  --blue:#8FA0D8; --blue-soft:#E9EDF8; --blue-deep:#4B5BA6;
  --beige:#F9DFC6; --beige-soft:#FCEEE1;
  --good:#1B7A4B; --good-soft:#E3F3EA; --warn:#9A5600; --warn-soft:#FFF0DF; --bad:#BC3427; --bad-soft:#FBE7E4;
  --demo:#6B57C9; --demo-soft:#EFEBFB;
  --heat0:#F4F6FB; --heat1:#DCE2F4; --heat2:#BCC6EA; --heat3:#8FA0D8; --heat4:#4B5BA6;
  --r-sm:10px; --r:16px; --r-lg:24px;
  --shadow:0 1px 2px rgba(11,8,41,.04),0 8px 24px rgba(11,8,41,.06);
  --f-display:"Comfortaa","Varela Round","Nunito",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:.98rem}
a{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num,td.n,.kpi .v,.rank-metric .v{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Topo */
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.5rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:flex-start;gap:3px;letter-spacing:-.02em;line-height:1}
.dot{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--orange);margin-top:-.05em}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-weight:600;margin-right:auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumb b{color:var(--ink)}
.feed-btn{border:0;background:var(--beige);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.feed-btn:hover{background:#F5D2B1}
.feed-btn[aria-current="page"]{box-shadow:inset 0 0 0 2px var(--ink)}
.feed-btn svg{width:16px;height:16px}
.pv-bar{display:flex;flex-direction:column;gap:14px;padding-block:6px 0}
.pv-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.pv-head h1{font-size:clamp(1.4rem,3vw,1.9rem)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
select,input[type=date],input[type=text],input[type=search],textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;min-width:0}
select:hover,input:hover,textarea:hover{border-color:#D8D5E3}
textarea{width:100%;resize:vertical;line-height:1.5}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 4px;margin-right:18px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.95rem;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

main.wrap{padding-block:32px 120px;display:flex;flex-direction:column;gap:24px}
body.is-base{background:var(--beige-soft)}
body.is-base main.wrap{max-width:1160px}

/* Entrada */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:32px 8px}
.wordmark{font-size:clamp(3.2rem,9vw,5.6rem);display:inline-flex;align-items:flex-start;gap:6px;letter-spacing:-.04em;line-height:.95}
.lede{font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--muted);max-width:34ch;margin:0}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.pv-card{display:grid;grid-template-columns:auto 1fr;gap:18px 20px;padding:28px;border-radius:var(--r-lg);background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s ease,border-color .15s ease}
.pv-card:hover{transform:translateY(-2px);border-color:var(--orange)}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.3rem;background:var(--orange);color:var(--ink)}
.pv-card:nth-child(even) .avatar{background:var(--blue)}
.pv-card-body{display:flex;flex-direction:column;gap:2px;justify-content:center;min-width:0}
.pv-name{font-family:var(--f-display);font-weight:700;font-size:1.35rem}
.pv-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.pv-stats span{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted)}
.pv-stats b{font-family:var(--f-display);font-size:1.25rem;color:var(--ink)}
.pv-go{grid-column:1/-1;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.pv-go::after{content:"";width:28px;height:2px;background:var(--orange);border-radius:2px;transition:width .15s ease}
.pv-card:hover .pv-go::after{width:44px}
.home-foot{color:var(--muted);font-size:.9rem}

/* Blocos */
.panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0}
body.is-base .panel{border-color:#F1D9C2}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.grid2>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--bg);padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn.primary:hover{background:#FF9524}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:10px}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{border-radius:var(--r);padding:14px 18px;font-size:.92rem;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.note.demo{background:var(--demo-soft);border:1px dashed var(--demo)}
.note.info{background:var(--blue-soft)}
.note.warn{background:var(--warn-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.demo{background:var(--demo);color:#fff}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.accent{background:var(--orange-soft);color:#8A4700}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--soft);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700}
.delta{font-size:.8rem;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* Gráfico */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;min-width:720px;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:600}
.chart .grid{stroke:var(--line)}
.chart .bar{fill:var(--orange)}
.chart .bar.dim{fill:var(--blue)}
.chart .val{fill:var(--ink);font-weight:800}

/* Tabelas */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--bg)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.cap{max-width:420px;min-width:220px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heat td.h{text-align:center;min-width:44px;font-size:.82rem;font-weight:700;border-radius:6px}

/* Ranking */
.rank{display:flex;flex-direction:column}
.rank-item{display:grid;grid-template-columns:40px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.rank-item:last-child{border-bottom:0}
.rank-pos{font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--blue);line-height:1}
.rank-item:first-child .rank-pos{color:var(--orange)}
.rank-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.rank-metric{text-align:right}
.rank-metric .v{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{background:var(--soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.fact .v{font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.minibars{display:flex;flex-direction:column;gap:8px}
.minibar{display:grid;grid-template-columns:160px 1fr 70px;gap:10px;align-items:center;font-size:.88rem}
.minibar .track{height:10px;background:var(--blue-soft);border-radius:999px;overflow:hidden}
.minibar .fill{height:100%;background:var(--blue);border-radius:999px}
.minibar:first-child .fill{background:var(--orange)}

/* Eco */
.eco-fab{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:15;border:0;cursor:pointer;background:var(--ink);color:#fff;border-radius:999px;padding:14px 22px 14px 16px;font-family:var(--f-display);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(11,8,41,.25)}
.eco-fab .dot{width:12px;height:12px;margin:0}
.eco-fab:hover{transform:translateY(-1px)}
.eco-scrim{position:fixed;inset:0;background:rgba(11,8,41,.18);z-index:19}
.eco{position:fixed;top:0;right:0;bottom:0;z-index:20;width:min(460px,100%);background:var(--bg);border-radius:var(--r-lg) 0 0 var(--r-lg);box-shadow:-12px 0 40px rgba(11,8,41,.14);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.eco-head{padding:20px 22px 14px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.eco-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eco-title h2{font-size:1.4rem;display:inline-flex;align-items:flex-start;gap:3px}
.chips-pv{display:flex;gap:6px;flex-wrap:wrap}
.chips-pv button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;cursor:pointer}
.chips-pv button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange)}
.msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 16px;border-radius:18px;line-height:1.55;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--blue-soft);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.msg.bot a{color:var(--blue-deep);font-weight:700}
.msg.bot p{margin:0 0 .5em}.msg.bot p:last-child{margin:0}
.msg.bot ul,.msg.bot ol{margin:.2em 0 .5em;padding-left:1.2em}
.msg .att{font-size:.8rem;opacity:.8;margin-top:4px}
.msg.sys{align-self:stretch;max-width:none;font-size:.9rem;color:var(--muted);background:none;padding:0}
.suggest{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.suggest button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 14px;cursor:pointer;font-size:.88rem;text-align:left}
.suggest button:hover{border-color:var(--orange)}
.composer{border-top:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.composer-row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:46px;max-height:160px;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 10px;font-size:.8rem}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0}
.icon-btn{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:1rem;flex:none}
.icon-btn:hover{background:var(--line)}

/* Legendas */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.caption-out{display:flex;flex-direction:column;gap:16px}
.caption-box{background:var(--soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.caption-text{white-space:pre-wrap;font-size:1rem;line-height:1.6;min-height:3em;outline:none;background:var(--bg);border-radius:12px;padding:14px}
.caption-text[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px var(--orange)}
.checks{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.check{display:flex;gap:8px;align-items:flex-start}
.dot.ok,.dot.no,.dot.mid{width:8px;height:8px;margin-top:7px;flex:none}
.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}.dot.mid{background:var(--orange)}

/* Alimentação */
.base-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.base-head h1{font-size:clamp(1.6rem,3.4vw,2.2rem)}
.drop{border:2px dashed #EBC9A8;border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);cursor:pointer;background:var(--beige-soft);font-weight:600}
.drop.over,.drop:hover{border-color:var(--orange);color:var(--ink)}
.list{display:flex;flex-direction:column}
.list-item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item>div{min-width:0}
details summary{cursor:pointer;font-weight:700}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--soft);padding:1px 6px;border-radius:6px}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.status{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}.pv-card,.pv-go::after{transition:none}}
@media (max-width:640px){
  .minibar{grid-template-columns:100px 1fr 56px}
  .rank-item{grid-template-columns:30px 1fr}
  .rank-metric{grid-column:2;text-align:left}
  .panel{padding:20px}
  .pv-card{padding:22px}
  .pv-stats{grid-template-columns:1fr 1fr}
  .top{position:static}
  .feed-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:16;width:44px;height:44px;padding:0;justify-content:center;box-shadow:0 6px 18px rgba(11,8,41,.12)}
  .feed-btn span{display:none}
  .top-row{padding-right:56px}
  .eco{border-radius:0}

}
/* ===== v4: mais cor, entrada, fotos, canais e Eco ===== */
:root{ --li:#0A66C2; --ig:linear-gradient(45deg,#F58529 0%,#DD2A7B 45%,#8134AF 75%,#515BD4 100%); }
body.is-splash{background:var(--ink)}
body.is-splash .top,body.is-splash .eco-fab,body.is-splash .eco-hello{display:none!important}
body.is-splash main.wrap{padding-block:0;max-width:none;padding-left:0;padding-right:0}

/* Capa */
.splash{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:48px max(24px,env(safe-area-inset-right,0px)) 48px max(24px,env(safe-area-inset-left,0px));position:relative;overflow:hidden;transition:opacity .45s ease,transform .45s ease}
.splash.leaving{opacity:0;transform:translateY(-24px)}
.splash-inner{max-width:1080px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:28px;position:relative;z-index:1}
.splash .wordmark{font-size:clamp(4.5rem,16vw,10rem);color:#fff}
.splash .wordmark .dot{width:.24em;height:.24em}
.splash-lede{font-size:clamp(1.15rem,2.6vw,1.6rem);max-width:30ch;margin:0;color:#E6E4F2;line-height:1.4}
.splash-lede b{color:var(--orange);font-weight:800}
.splash-feats{display:flex;flex-wrap:wrap;gap:10px}
.splash-feats span{border-radius:999px;padding:8px 16px;font-weight:700;font-size:.9rem;color:var(--ink)}
.splash-feats span:nth-child(1){background:var(--orange)}
.splash-feats span:nth-child(2){background:var(--blue)}
.splash-feats span:nth-child(3){background:var(--beige)}
.splash-feats span:nth-child(4){background:#fff}
.btn-enter{align-self:flex-start;border:0;background:var(--orange);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding:16px 30px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(255,132,0,.35)}
.btn-enter:hover{background:#FF9524}
.btn-enter svg{width:20px;height:20px}
.splash-shapes{position:absolute;right:-60px;bottom:-60px;display:grid;grid-template-columns:repeat(2,minmax(110px,17vw));gap:0;opacity:.95}
.splash-shapes i{display:block;aspect-ratio:1;border-radius:50%}
.splash-shapes i:nth-child(1){background:var(--blue);border-radius:999px 999px 0 999px}
.splash-shapes i:nth-child(2){background:var(--orange);border-radius:999px 999px 999px 0}
.splash-shapes i:nth-child(3){background:var(--beige);border-radius:999px 0 999px 999px}

.pv-photo .avatar{position:absolute;inset:0;margin:auto;width:110px;height:110px;font-size:2rem}
.splash-foot{font-size:.85rem;color:#9C99B6}

.pick-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-top:12px}
.pick-head h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.pick-head p{margin:6px 0 0;color:var(--muted);font-size:1.05rem}
.pv-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.pv-card{grid-template-columns:1fr;padding:0;overflow:hidden;border:0;gap:0;box-shadow:0 2px 4px rgba(11,8,41,.05),0 16px 40px rgba(11,8,41,.10)}
.pv-card:hover{transform:translateY(-4px);border-color:transparent}
.pv-photo{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--blue);overflow:hidden}
.pv-photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.pv-photo .badge{position:absolute;left:20px;bottom:20px;background:var(--orange);color:var(--ink);font-weight:800;font-size:.8rem;border-radius:999px;padding:6px 12px}
.pv-info{padding:24px 26px 26px;display:flex;flex-direction:column;gap:16px;color:#fff;background:var(--ink)}
.pv-card:nth-child(even) .pv-info{background:var(--blue);color:var(--ink)}
.pv-card:nth-child(even) .pv-photo .badge{background:var(--ink);color:#fff}
.pv-info .pv-name{font-size:1.6rem}

.pv-stats{border-top:1px solid rgba(255,255,255,.18);padding-top:16px}

.pv-stats span{color:inherit;opacity:.85}
.pv-stats b{color:inherit}
.pv-go{color:inherit}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Cabeçalho do porta-voz */
.pv-hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:28px 28px 0;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.pv-hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--orange);opacity:.95}
.pv-hero::before{content:"";position:absolute;right:110px;top:-40px;width:110px;height:110px;border-radius:50%;background:var(--blue)}
.pv-hero-top{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.pv-id{display:flex;align-items:center;gap:18px;min-width:0}
.pv-id .avatar{width:84px;height:84px;box-shadow:0 0 0 4px var(--orange);flex:none}
.pv-id h1{font-size:clamp(1.5rem,3.4vw,2.1rem);color:#fff}
.pv-id .muted{color:#CFCCE3}
.pv-hero .controls select,.pv-hero .controls input{background:#fff;border-color:transparent;color:var(--ink);font-weight:700}
.pv-hero .tabs{position:relative;z-index:1;gap:6px;margin:0;padding-bottom:16px}
.pv-hero .tabs button{margin:0;padding:10px 18px;border-radius:999px;border:0;color:#CFCCE3;background:rgba(255,255,255,.06)}
.pv-hero .tabs button:hover{color:#fff;background:rgba(255,255,255,.12)}

/* Seletor de canal nas cores dos apps */
.seg.canal{background:#fff;padding:4px;gap:4px}

.seg.canal button[data-canal="instagram"][aria-pressed="true"]{background:var(--ig);color:#fff}

.kpi:nth-child(1) .delta.up{color:#0B4D2E}.kpi:nth-child(1) .delta.down{color:#6E1309}

.kpi:last-child .label{color:#CFCCE3}
.kpi:last-child .delta.up{color:#7FE0AE}.kpi:last-child .delta.down{color:#FF9C90}
.rank-item{padding:16px 14px;border-radius:var(--r);border-bottom:0}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast("Copiado."); }

function sampleErr(e){
  const c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared") return "A IA não foi liberada nesta visualização. Abra o menu de permissões do artefato e permita o uso do Claude.";
  if(c==="rate_limited") return "Muitos pedidos seguidos ou limite de uso atingido. Espere um pouco e tente de novo.";
  if(c==="prompt_too_large") return "O material ficou grande demais para um pedido só. Anexe menos arquivos ou textos menores.";
  if(c==="image_rejected") return "A imagem não foi aceita. Use JPG, PNG ou WebP com menos de 20 MB.";
  if(c==="invalid_json") return "A resposta veio fora do formato esperado. Tente gerar de novo.";
  if(c==="refused") return "O pedido foi recusado. Reformule o tema ou o contexto.";
  if(c==="cancelled") return "";
  return "A IA não respondeu agora. Tente de novo em instantes.";
}

    case "90d": return [addDays(t,-89),t];

    case "ano-1": return [`${y-1}-01-01`,`${y-1}-12-31`];
    case "12m": return [addDays(t,-364),t];
    case "custom": return [S.de||"2000-01-01", S.ate||t];
    default: return ["2000-01-01","2999-12-31"];
  }
}
function prevRange([a,b]){
  if(S.periodo==="tudo") return null;
  const days=Math.round((new Date(b)-new Date(a))/864e5)+1;
  return [addDays(a,-days), addDays(a,-1)];
}
function rangeLabel(){
  if(S.periodo==="custom") return `${fmtDate(S.de)} a ${fmtDate(S.ate)}`;
  return (periodOptions().find(o=>o[0]===S.periodo)||[])[1]||"";
}
function allPosts(){ return S.demo ? demoPosts() : S.posts; }
function scoped(range, opts={}){
  const [a,b]=range||getRange();
  return allPosts().filter(p=>p.pv===S.pv && (opts.ambos||p.canal===S.canal) && p.data>=a && p.data<=b);
}
function monthsBetween(a,b){
  const out=[]; let [y,m]=a.split("-").map(Number); const [y2,m2]=b.split("-").map(Number);
  while(y<y2||(y===y2&&m<=m2)){ out.push(`${y}-${String(m).padStart(2,"0")}`); m++; if(m>12){m=1;y++;} if(out.length>60) break; }
  return out;
}
function effectiveRange(posts){
  let [a,b]=getRange();
  if(S.periodo==="tudo"&&posts.length){ a=posts.reduce((m,p)=>p.data<m?p.data:m,"9999"); b=posts.reduce((m,p)=>p.data>m?p.data:m,"0000"); }
  if(S.periodo.startsWith("ano")&&b>todayISO()) b=todayISO();
  return [a,b];
}
const mLabel = ym=>{ const [y,m]=ym.split("-"); return `${MESES[+m-1]}/${y.slice(2)}`; };
function median(arr){ const a=arr.filter(v=>v!=null).sort((x,y)=>x-y); if(!a.length) return 0; const i=Math.floor(a.length/2); return a.length%2?a[i]:(a[i-1]+a[i])/2; }

/* Métrica que mais se destaca: maior razão em relação à mediana do período */
function standout(p, pool){
  let best=null;
  for(const m of METRICAS){
    const v=p[m.k]; if(v==null) continue;
    const med=median(pool.map(x=>x[m.k]));
    const ratio=med>0?v/med:(v>0?99:0);
    if(!best||ratio>best.ratio) best={k:m.k,l:m.l,v,ratio};
  }
  return best;
}

/* ============================== Dados de exemplo (fictícios) ============================== */
let _demo=null;
function demoPosts(){
  if(_demo) return _demo;
  let seed=42; const rnd=()=>{ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; };
  const temas={
    renato:["visita à revenda em Campinas","encontro com revendedores no Nordeste","nova loja de conveniência","programa de fidelidade","treinamento de frentistas","feira de varejo","pista mais rápida no posto","parceria com aplicativo de mobilidade"],
    linden:["resultado do trimestre","transição energética no setor","visão de longo prazo para a companhia","inauguração de base de distribuição","diversidade na liderança","evento do setor de combustíveis","marco de 50 anos de carreira","investimento em infraestrutura"],
  };
  const out=[]; const end=new Date(); const start=new Date(end); start.setMonth(start.getMonth()-15);
  for(const pv of ["renato","linden"]) for(const canal of ["linkedin","instagram"]){
    let d=new Date(start);
    while(d<end){
      d=new Date(d.getTime()+ (3+Math.floor(rnd()*8))*864e5); if(d>end) break;
      const tipo=TIPOS[Math.floor(rnd()*TIPOS.length)];
      const formato=canal==="linkedin"?["Imagem","Carrossel","Vídeo","Só texto"][Math.floor(rnd()*4)]:["Imagem","Carrossel","Reels"][Math.floor(rnd()*3)];
      const base=(canal==="linkedin"?380:620)*(pv==="linden"?1.3:1)*(0.4+rnd()*1.6)*(tipo==="Marco pessoal"?1.8:1)*(formato==="Reels"?1.5:1);
      const tema=temas[pv][Math.floor(rnd()*temas[pv].length)];
      const iso=d.toISOString().slice(0,10);
      out.push({id:"demo"+out.length, demo:true, pv, canal, data:iso, link:"https://exemplo.invalid/post/"+out.length,
        legenda:`[EXEMPLO FICTÍCIO] Post sobre ${tema}.`, formato, tipo,
        curtidas:Math.round(base), comentarios:Math.round(base*(0.03+rnd()*0.08)), compartilhamentos:Math.round(base*(0.005+rnd()*0.03)),
        impressoes:canal==="linkedin"?Math.round(base*(18+rnd()*25)):null});
    }
  }
  return _demo=out;
}

function monthlyChart(posts,k){
  if(!posts.length) return `<div class="empty">Sem posts no período.</div>`;
  const [a,b]=effectiveRange(posts); const months=monthsBetween(a,b);
  const data=months.map(m=>{ const ps=posts.filter(p=>p.data.startsWith(m)); const vals=ps.map(p=>metricVal(p,k)).filter(v=>v!=null); return {m,n:ps.length,v:vals.length?vals.reduce((s,x)=>s+x,0):null}; });
  const max=Math.max(1,...data.map(d=>d.v||0));
  const W=Math.max(960,months.length*64), H=240, L=48, R=10, T=24, B=46;
  const bw=(W-L-R)/months.length;
  const nice=(()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); const s=[1,2,2.5,5,10].find(x=>x*p>=max/4)||10; return s*p; })();
  const top=Math.ceil(max/nice)*nice; const y=v=>T+(H-T-B)*(1-v/top);
  let g=""; for(let v=0;v<=top+1e-9;v+=nice){ g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  const bars=data.map((d,i)=>{ const x=L+i*bw+bw*0.18, w=bw*0.64; const last=i===data.length-1;
    if(d.v==null) return `<text x="${x+w/2}" y="${H-B+16}" text-anchor="middle">${mLabel(d.m)}</text><text x="${x+w/2}" y="${H-B+32}" text-anchor="middle">${d.n} posts</text>`;
    return `<rect class="bar${last?"":" dim"}" x="${x}" y="${y(d.v)}" width="${w}" height="${Math.max(0,y(0)-y(d.v))}" rx="3"><title>${mLabel(d.m)}: ${fmt(d.v)}</title></rect>
      ${d.v>0?`<text class="val" x="${x+w/2}" y="${y(d.v)-6}" text-anchor="middle">${fmt(d.v)}</text>`:""}
      <text x="${x+w/2}" y="${H-B+16}" text-anchor="middle">${mLabel(d.m)}</text><text x="${x+w/2}" y="${H-B+32}" text-anchor="middle">${d.n} post${d.n===1?"":"s"}</text>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${metricLabel(k)} por mês">${g}${bars}</svg></div>`;
}

function heatGrid(posts,field,cats){
  if(!posts.length) return `<div class="empty">Sem posts no período.</div>`;
  const [a,b]=effectiveRange(posts); const months=monthsBetween(a,b);
  const cells=[]; let maxAvg=1;
  const rows=cats.concat(posts.some(p=>!p[field])?["(sem classificação)"]:[]).map(c=>{
    const ps=posts.filter(p=>(p[field]||"(sem classificação)")===c);
    const per=months.map(m=>{ const x=ps.filter(p=>p.data.startsWith(m)); const avg=x.length?x.reduce((s,p)=>s+eng(p),0)/x.length:0; if(avg>maxAvg) maxAvg=avg; return {n:x.length,avg}; });
    return {c,ps,per,trend:trend(ps,months)};
  }).filter(r=>r.ps.length);
  const shade=avg=>{ if(!avg) return "var(--heat0)"; const r=avg/maxAvg; return r>.8?"var(--heat4)":r>.55?"var(--heat3)":r>.3?"var(--heat2)":"var(--heat1)"; };
  const txt=avg=>avg/maxAvg>.8?"color:#fff":"";
  return `<div class="table-wrap"><table class="heat"><thead><tr><th>${field==="tipo"?"Tipo":"Formato"}</th>${months.map(m=>`<th style="text-align:center">${mLabel(m)}</th>`).join("")}<th class="n">Posts</th><th class="n">Eng. médio</th><th class="n">Tendência</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td style="white-space:nowrap">${esc(r.c)}</td>${r.per.map(x=>`<td class="h" style="background:${shade(x.avg)};${txt(x.avg)}" title="${x.n} posts · eng. médio ${fmt(Math.round(x.avg))}">${x.n||""}</td>`).join("")}
  <td class="n">${r.ps.length}</td><td class="n">${fmt(Math.round(r.ps.reduce((s,p)=>s+eng(p),0)/r.ps.length))}</td><td class="n">${trendTag(r.trend)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function trend(ps,months){
  if(months.length<6) return null;
  const last=months.slice(-3), prev=months.slice(-6,-3);
  const f=ms=>{ const x=ps.filter(p=>ms.some(m=>p.data.startsWith(m))); return {n:x.length,e:x.reduce((s,p)=>s+eng(p),0)}; };
  const A=f(last),B=f(prev); if(!B.n||!A.n) return A.n&&!B.n?{novo:true}:null;
  return {pct:Math.round(((A.e/A.n)-(B.e/B.n))/(B.e/B.n)*100), dn:A.n-B.n};
}
function trendTag(t){ if(!t) return '<span class="muted">–</span>'; if(t.novo) return '<span class="tag accent">novo</span>'; return `<span class="tag ${t.pct>=10?"good":t.pct<=-10?"bad":""}">${t.pct>=0?"+":""}${t.pct}%</span>`; }
function growthSummary(posts){

  if(months.length<6) return `<p class="muted small">Escolha um período de pelo menos 6 meses para ver quais temas cresceram.</p>`;
  const rows=TIPOS.map(t=>({t,tr:trend(posts.filter(p=>p.tipo===t),months)})).filter(r=>r.tr&&r.tr.pct!=null).sort((x,y)=>y.tr.pct-x.tr.pct);
  if(!rows.length) return "";

function md(s){
  let h=esc(s);
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  const lines=h.split("\n"); let out="", list=null;
  for(const ln of lines){
    const ul=ln.match(/^\s*[-*•]\s+(.*)/), ol=ln.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul||ol){ const t=ul?"ul":"ol"; if(list!==t){ if(list) out+=`</${list}>`; out+=`<${t}>`; list=t; } out+=`<li>${(ul||ol)[1]}</li>`; continue; }
    if(list){ out+=`</${list}>`; list=null; }
    if(ln.trim()) out+=`<p>${ln.replace(/^#+\s*/,"")}</p>`;
  }
  if(list) out+=`</${list}>`;
  return out;
}

  try{
    while(c.turns.length>16) c.turns.splice(0,2);
    while(c.turns[0]&&c.turns[0].role!=="user") c.turns.shift();
    const instr=chatInstructions(pv)+(S.toolsOk?"":chatFallbackData(pv));
    const opts={cache:false, signal:ctl.signal, onText:({text})=>{ bot.text=text; if(S.ecoOpen&&S.ecoPv===pv) updateChat(); }};
    if(S.toolsOk) opts.tools=chatTools(pv);
    if(imgs.length) opts.images=imgs;
    const res=await sample([{role:"user",content:instr},{role:"assistant",content:"Entendido. Vou consultar só a base deste porta-voz e citar os posts com link."},...c.turns], opts);
    bot.text=res.text+(res.truncated?"\n\n(Resposta cortada. Peça uma parte de cada vez.)":"");
    c.turns.push({role:"assistant",content:res.text});
  }catch(e){
    const m=sampleErr(e); bot.text=(e.text||"")+(m?`\n\n${m}`:"\n\n(interrompido)");
    if(e.code==="not_granted"||e.code==="sampling_disabled") S.sampleOk=false;
    if(e.code==="tools_unavailable") S.toolsOk=false;
    c.turns.pop();
  }finally{ bot.busy=false; S.chatBusy=false; S.chatCtl=null; if(S.ecoOpen) updateChat(); }
}

/* ============================== Leitura de arquivos ============================== */
async function extractFile(file){
  const name=file.name, ext=(name.split(".").pop()||"").toLowerCase();
  if(file.type.startsWith("image/")) return {kind:"image"};
  if(["txt","md","csv","json","tsv"].includes(ext)) return {kind:"text", text:await file.text()};
  if(["xlsx","xls"].includes(ext)){
    await loadScript(CDN.xlsx); const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    return {kind:"text", text:wb.SheetNames.map(n=>`# Aba: ${n}\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n")};
  }
  if(ext==="pptx"){
    await loadScript(CDN.jszip); const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const slides=Object.keys(zip.files).filter(f=>/^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));
    const parts=[]; for(const f of slides){ const x=await zip.file(f).async("string"); const t=[...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" "); parts.push(`[Slide ${f.match(/\d+/)[0]}] ${decodeXml(t)}`); }
    return {kind:"text", text:parts.join("\n")};
  }
  if(ext==="docx"){
    await loadScript(CDN.jszip); const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const x=await zip.file("word/document.xml").async("string");
    const paras=x.split(/<\/w:p>/).map(p=>[...p.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(m=>m[1]).join("")).filter(Boolean);
    return {kind:"text", text:decodeXml(paras.join("\n"))};
  }
  if(ext==="pdf"){
    await loadScript(CDN.pdf); await loadScript(CDN.pdfw);
    const lib=window.pdfjsLib; const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const out=[]; for(let i=1;i<=Math.min(doc.numPages,60);i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); out.push(tc.items.map(it=>it.str).join(" ")); }
    return {kind:"text", text:out.join("\n\n")};
  }
  if(["ppt","doc"].includes(ext)) throw new Error(`O formato .${ext} antigo não é lido no navegador. Salve como .${ext}x e envie de novo.`);
  throw new Error(`Formato .${ext} não suportado.`);
}
function decodeXml(s){ return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&"); }
async function addChatFiles(files){
  for(const f of files){
    const a={name:f.name, ready:false}; S.chatAtt.push(a); updateChat();
    try{ const r=await extractFile(f); if(r.kind==="image"){ if(!S.imagesOk) throw new Error("Imagens não estão liberadas nesta visualização."); a.blob=f; } else a.text=r.text; a.ready=true; }
    catch(e){ S.chatAtt.splice(S.chatAtt.indexOf(a),1); toast(`${f.name}: ${e.message}`); }
    updateChat();
  }
}

function checkCaption(t){
  const pv=S.pv; const res=[];
  const add=(ok,msg,level)=>res.push({ok,msg,level:ok?"ok":level||"no"});
  add(!/[—–]|\s-\s/.test(t),"Sem travessão");
  const dated=t.match(/\b(hoje|ontem|amanh[ãa]|nesta semana|esta semana|semana passada|neste fim de semana|agora há pouco|recentemente)\b/i);
  add(!dated, dated?`Palavra que data o texto: "${dated[0]}"`:"Sem palavras que datam o texto");
  const lines=t.split("\n").map(l=>l.trim()).filter(l=>l&&!/^([#@][\wÀ-ú.]+\s*)+$/.test(l)&&!/^\[.*\]$/.test(l));
  const bad=lines.filter(l=>!/[.!?…]["”)]?$/.test(l));
  add(!bad.length, bad.length?`Parágrafo sem ponto final: "${bad[0].slice(-40)}"`:"Ponto final em todas as frases");
  const gen=["jornada","juntos somos","gratidão","é sobre isso","inspirador","faz toda a diferença","seguimos juntos","rumo ao futuro","não é apenas","mais do que nunca","sinergia","transformar vidas"].filter(g=>norm(t).includes(norm(g)));
  add(!gen.length, gen.length?`Possível linguagem genérica: ${gen.join(", ")}`:"Sem expressões genéricas da lista de alerta", "mid");
  if(pv==="renato"){
    add(!t.includes(":"),"Sem dois pontos (regra do Renato)");
    add(!/\bRevendas?\b/.test(t),"\"revenda\" em minúscula (regra do Renato)");
  }
  if(pv==="linden"){
    const opens=S.posts.filter(p=>p.pv==="renato").map(p=>norm(p.legenda).split(/\s+/).slice(0,4).join(" ")).filter(Boolean);
    const mine=norm(t).split(/\s+/).slice(0,4).join(" ");
    add(!opens.includes(mine),"Abertura diferente das legendas do Renato");
  }
  return res;
}
function checksHtml(t){ if(!t) return ""; return checkCaption(t).map(c=>`<div class="check"><span class="dot ${c.level}"></span><span>${esc(c.msg)}</span></div>`).join("")+`<div class="small muted">Checagem automática das regras objetivas. Tom e voz dependem da sua revisão.</div>`; }
function pickRefs(pv,canal,tema){
  const ps=S.posts.filter(p=>p.pv===pv&&p.canal===canal&&p.legenda);
  const top=ps.slice().sort((a,b)=>eng(b)-eng(a)).slice(0,6), rec=ps.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,6);
  const seen=new Set(); const refs=[...top,...rec].filter(p=>!seen.has(p.id)&&seen.add(p.id));
  const same=S.posts.filter(p=>p.pv===pv&&p.legenda&&tema&&matchTerm(p.legenda,tema)).slice(0,5);
  return {refs, same};
}

  const {refs,same}=pickRefs(S.pv,S.canal,C.tema);
  const mats=S.materiais.filter(m=>m.pv===S.pv||m.pv==="geral");
  let matTxt=""; for(const m of mats){ const piece=`\n[${m.tipo} · ${m.titulo}]\n${(m.texto||"").slice(0,8000)}\n`; if(matTxt.length+piece.length>40000) break; matTxt+=piece; }
  const otherOpen=other.flatMap(o=>S.posts.filter(p=>p.pv===o.id&&p.legenda).slice(-8).map(p=>`- ${p.legenda.split(/[.!?\n]/)[0].slice(0,120)}`));
  const prompt=`Você escreve legendas de redes sociais para ${pv.nome} (${pv.cargo}, ${pv.cliente}), para o ${CANAIS[S.canal]}. A equipe do núcleo digital da FSB vai revisar e aprovar antes de publicar.

LEGENDAS JÁ PUBLICADAS POR ELE NESTE CANAL. Use só como referência de tom e de jeito de abrir frase. Nunca copie estrutura nem frases:
${refs.length?refs.map(p=>`---\n${p.legenda.slice(0,1500)}`).join("\n"):"(nenhuma na base ainda)"}

${otherOpen.length?`ABERTURAS DE OUTROS PORTA-VOZES DO MESMO CLIENTE. A legenda não pode se parecer com elas em abertura, estrutura ou vocabulário:\n${otherOpen.join("\n")}\n`:""}
${matTxt?`MATERIAIS DE REFERÊNCIA E FEEDBACKS DA EQUIPE:\n${matTxt}\n`:""}
PEDIDO
Tema: ${C.tema}
Contexto: ${C.contexto||"(sem contexto adicional)"}
${C.img?"Há uma foto anexada. Use o que se vê nela só para dar concretude, sem inventar nomes, números ou lugares.":""}

Como escrever:
- Primeira pessoa, na voz dele. Não pode soar como marca nem como IA.

- ${S.canal==="linkedin"?"LinkedIn: parágrafos curtos, de 3 a 6, sem excesso de hashtags (no máximo 3, ou nenhuma).":"Instagram: mais curta e direta que no LinkedIn."}${S.canal==="instagram"&&S.pv==="renato"?" Deixe uma linha final no formato [marcar: parceiros e revendas] para a equipe preencher.":""}
- Sem travessão. Ponto final em todas as frases. Nada de "hoje", "ontem" ou similares.
- A versão curta tem no máximo metade do tamanho da principal e não é só a principal cortada.

Responda só com JSON neste formato:
{"principal":"texto com quebras de linha \\n","curta":"texto","observacoes":"uma ou duas frases sobre escolhas feitas ou informação que faltou"}`;
  C.busy=true; C.err=""; render();
  try{

const COLMAP={data:["data","date","publicado em","data de publicacao","data publicacao","dia"],pv:["porta_voz","porta-voz","porta voz","portavoz","executivo","perfil"],canal:["canal","rede","plataforma","rede social"],link:["link","url","permalink","link do post"],legenda:["legenda","texto","caption","post","conteudo","copy"],formato:["formato","tipo de midia","midia","format"],tipo:["tipo","tipo de conteudo","tipo_conteudo","tema","categoria","editoria"],curtidas:["curtidas","likes","reacoes","reactions","curtidas/reacoes"],comentarios:["comentarios","comments"],compartilhamentos:["compartilhamentos","shares","reposts","compart"],impressoes:["impressoes","impressions","alcance","views","visualizacoes"]};
function mapHeader(h){ const n=norm(h).replace(/_/g," "); for(const [k,al] of Object.entries(COLMAP)) if(al.some(a=>norm(a).replace(/_/g," ")===n)) return k; return null; }
function parseNum(v){ if(v==null||v==="") return null; if(typeof v==="number") return Math.round(v); let s=String(v).trim().toLowerCase().replace(/\s/g,""); let mult=1; if(/mil$|k$/.test(s)){ mult=1000; s=s.replace(/mil$|k$/,""); } if(/,\d{1,2}$/.test(s)&&mult>1) s=s.replace(",","."); else s=s.replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."); const n=parseFloat(s); return isNaN(n)?null:Math.round(n*mult); }
function parseDate(v){
  if(v==null||v==="") return null;
  if(v instanceof Date&&!isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return null;
}
function mapCat(v,cats){ const n=norm(v); if(!n) return null; const exact=cats.find(c=>norm(c)===n); if(exact) return exact; const al={"reel":"Reels","reels":"Reels","video":"Vídeo","foto":"Imagem","imagem":"Imagem","image":"Imagem","carrossel":"Carrossel","carousel":"Carrossel","documento":"Carrossel","texto":"Só texto","so texto":"Só texto","text":"Só texto","esg":"ESG e diversidade","diversidade":"ESG e diversidade","mercado":"Setor e mercado","setor":"Setor e mercado","inauguracao":"Inauguração e expansão","expansao":"Inauguração e expansão","campanha":"Campanha e produto","produto":"Campanha e produto","evento":"Evento","marco":"Marco pessoal","pessoal":"Marco pessoal","bastidor":"Bastidores","institucional":"Institucional"};
  for(const [k,c] of Object.entries(al)) if(n.includes(k)&&cats.includes(c)) return c; return null; }
function mapPv(v){ const n=norm(v); if(!n) return null; return (S.pvs.find(p=>norm(p.nome)===n||norm(p.id)===n)||S.pvs.find(p=>norm(p.nome).split(" ").some(w=>w.length>3&&n.includes(w))))?.id||null; }
function mapCanal(v){ const n=norm(v); if(!n) return null; if(n.includes("linked")||n==="li"||n==="in") return "linkedin"; if(n.includes("insta")||n==="ig") return "instagram"; return null; }
/* Arquivos exportados pelos raspadores do Apify (LinkedIn profile posts e Instagram post scraper) */
function detectApify(h){
  if(h.includes("linkedinUrl")&&h.includes("content")&&h.includes("author/name")) return "apify-linkedin";
  if(h.includes("shortCode")&&h.includes("ownerUsername")) return "apify-instagram";
  return null;
}
function toBRT(v){
  const d=v instanceof Date?v:new Date(String(v)); if(isNaN(d)) return parseDate(v);
  return new Date(d.getTime()-3*36e5).toISOString().slice(0,10);
}
function apifyRow(kind,r,i){
  const g=k=>r[k]==null?"":String(r[k]).trim(); const linha=i+2;
  if(kind==="apify-linkedin"){
    const pv=mapPv(g("author/name"));
    const base={linha,canal:"linkedin",link:g("linkedinUrl")||g("shareLinkedinUrl"),pv,data:toBRT(r["postedAt/date"]),tipo:null};
    if(!pv) return {...base,legenda:"",erro:`post de ${g("author/name")||"outro autor"} compartilhado no perfil, ignorado`};
    const formato=g("postVideo/videoUrl")?"Vídeo":(g("document/title")||g("document/totalPageCount")||g("postImages/1/url"))?"Carrossel":g("postImages/0/url")?"Imagem":"Só texto";
    let legenda=g("content"); if(!legenda&&g("repost/content")) legenda="[Compartilhou sem comentário] "+g("repost/content");
    return {...base,legenda,formato,curtidas:parseNum(r["engagement/likes"]),comentarios:parseNum(r["engagement/comments"]),compartilhamentos:parseNum(r["engagement/shares"]),impressoes:null,erro:base.data?"":"data inválida"};
  }
  let pv=mapPv(g("ownerFullName"))||mapPv(g("ownerUsername"));
  for(let k=0;!pv&&k<6;k++) pv=mapPv(g(`coauthorProducers/${k}/username`));
  const fmtIg={Sidecar:"Carrossel",Video:"Reels",Image:"Imagem"}[g("type")]||null;
  const out={linha,canal:"instagram",pv,data:toBRT(r.timestamp),link:g("url"),legenda:g("caption"),formato:fmtIg,tipo:null,
    curtidas:parseNum(r.likesCount),comentarios:parseNum(r.commentsCount),compartilhamentos:null,impressoes:null};
  out.erro=!pv?`perfil ${g("ownerUsername")} não é de um porta-voz cadastrado`:!out.data?"data inválida":"";
  return out;
}
async function handleImport(file){
  try{
    await loadScript(CDN.xlsx);
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const sh=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(sh,{defval:"",raw:true});
    if(!rows.length) throw new Error("A planilha está vazia.");
    const headers=Object.keys(rows[0]); const map={}; const unmapped=[];
    const apify=detectApify(headers);
    if(apify){ S.imp={file:file.name, rows:rows.map((r,i)=>apifyRow(apify,r,i)).filter((r,i,a)=>!r.link||a.findIndex(x=>x.link===r.link)===i), unmapped:[], busy:false, done:0, fonte:apify}; render(); return; }
    headers.forEach(h=>{ const k=mapHeader(h); if(k&&!Object.values(map).includes(k)) map[h]=k; else unmapped.push(h); });
    const out=rows.map((r,i)=>{
      const o={linha:i+2}; for(const [h,k] of Object.entries(map)) o["_"+k]=r[h];
      const p={pv:mapPv(o._pv)||(o._pv?null:S.pv), canal:mapCanal(o._canal)||(o._canal?null:S.canal), data:parseDate(o._data), link:String(o._link||"").trim(), legenda:String(o._legenda||"").trim(),
        formato:mapCat(o._formato,FORMATOS), tipo:mapCat(o._tipo,TIPOS)};
      for(const m of METRICAS) p[m.k]=parseNum(o["_"+m.k]);
      let erro=""; if(!p.pv) erro=`porta-voz "${o._pv}" não cadastrado`; else if(!p.canal) erro=`canal "${o._canal}" não reconhecido`; else if(!p.data) erro="data ausente ou inválida"; else if(!p.link&&!p.legenda) erro="sem link e sem legenda";
      return {...p, linha:o.linha, erro};
    }).filter(r=>r.data||r.link||r.legenda);
    S.imp={file:file.name, rows:out, unmapped, busy:false, done:0}; render();
  }catch(e){ toast(e.message||"Não consegui ler a planilha."); }
}
async function saveImport(){
  const I=S.imp; if(!db) return toast("Base indisponível.");
  const ok=I.rows.filter(r=>!r.erro); I.busy=true; I.done=0; render();
  const now=new Date().toISOString();
  try{
    for(const r of ok){
      const id="p"+hash(r.link||(r.pv+r.canal+r.data+r.legenda.slice(0,80)));
      const existing=S.posts.find(p=>p.id===id);
      const doc={...(I.fonte?{fonte:I.fonte}:{}),pv:r.pv,canal:r.canal,data:r.data,link:r.link,legenda:r.legenda.slice(0,8000),formato:r.formato||existing?.formato||null,tipo:r.tipo||existing?.tipo||null,atualizadoEm:now};
      for(const m of METRICAS) doc[m.k]=r[m.k];
      await db.collection("posts").doc(id).set(doc);
      I.done++; if(I.done%10===0) render();
    }
    toast(`${ok.length} posts salvos.`); S.imp=null;
  }catch(e){ toast(e.code==="quota_exceeded"?"A base chegou ao limite de espaço.":"Erro ao salvar. Tente de novo."); I.busy=false; }
  render();
}
async function classifyMissing(){
  if(!sample||!db) return toast("IA ou base indisponível.");
  const todo=S.posts.filter(p=>p.pv===S.pv&&!p.tipo&&p.legenda);
  try{
    for(let i=0;i<todo.length;i+=25){
      const batch=todo.slice(i,i+25); S.matBusy=`Classificando ${i+1} a ${i+batch.length} de ${todo.length}…`; render();
      const res=await sample.json(`Classifique cada post de rede social de um executivo em UM tipo de conteúdo desta lista exata: ${TIPOS.join("; ")}.
Responda só com um JSON array de objetos {"id":"...","tipo":"..."} na mesma ordem.

${batch.map(p=>JSON.stringify({id:p.id,legenda:p.legenda.slice(0,700)})).join("\n")}`,{modelTier:"quick"});
      for(const r of (Array.isArray(res)?res:[])){ const t=mapCat(r.tipo,TIPOS); if(t&&batch.some(p=>p.id===r.id)) await db.collection("posts").doc(String(r.id)).update({tipo:t,tipoPorIA:true}); }
    }
    toast("Classificação concluída. Revise os tipos na tabela.");
  }catch(e){ toast(sampleErr(e)||"Classificação interrompida."); }
  S.matBusy=""; render();
}
async function addMaterials(files){
  if(!db) return toast("Base indisponível.");
  const pv=$("#mat-pv").value, tipo=$("#mat-tipo").value;
  for(const f of files){
    S.matBusy=`Lendo ${f.name}…`; render();
    try{
      const r=await extractFile(f); let texto;
      if(r.kind==="image"){
        if(!sample||!S.imagesOk) throw new Error("A leitura de imagens precisa da IA liberada.");
        const {text}=await sample(`Esta imagem é material de referência de um porta-voz (${pvById(pv)?.nome||"núcleo"}) para a equipe de redes sociais. Descreva em português, objetivamente, o que aparece: pessoas, lugar, texto visível, tipo de evento, estilo visual. Transcreva todo texto legível. Não invente nomes.`,{images:[f]});
        texto=`[Descrição da imagem ${f.name}]\n${text}`;
      } else texto=r.text;
      const cortado=texto.length>100000;
      await db.collection("materiais").add({pv,tipo:r.kind==="image"?"Imagem":tipo,titulo:f.name,texto:texto.slice(0,100000),cortado,criadoEm:new Date().toISOString()});
      toast(`${f.name} adicionado.`);
    }catch(e){ toast(`${f.name}: ${e.message||sampleErr(e)}`); }
  }
  S.matBusy=""; render();
}

/* ============================== Eventos ============================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-canal],[data-act]"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; savePrefs(); render(); return; }
  if(t.dataset.act==="open-base"){ if(S.view!=="base") S.lastHash=location.hash||"#inicio"; go("#alimentacao"); return; }
  if(t.dataset.act==="close-base"){ go(S.lastHash&&!["#alimentacao","#inicio",""].includes(S.lastHash)?S.lastHash:"#portavozes"); return; }
  if(t.dataset.act==="eco-open"){ openEco(); return; }
  if(t.dataset.act==="hello-x"){ try{ localStorage.setItem("eco-hello-x","1"); }catch(_){} $("#eco-hello").hidden=true; return; }
  if(t.dataset.act==="enter"){ const sp=$("#splash"); const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; if(sp&&!reduce){ sp.classList.add("leaving"); setTimeout(()=>go("#portavozes"),420); } else go("#portavozes"); return; }
  if(t.dataset.act==="eco-close"){ closeEco(); return; }
  if(t.dataset.act==="eco-pv"){ if(S.chatBusy) return toast("Espere a resposta terminar."); S.ecoPv=t.dataset.id; S.chatAtt=[]; renderEco(); return; }
  if(t.dataset.act==="base-pv"){ S.pv=t.dataset.id; S.cap.result=null; savePrefs(); render(); return; }
  if(t.dataset.canal){ S.canal=t.dataset.canal; savePrefs(); render(); return; }
  const a=t.dataset.act;
  if(a==="demo-on"){ S.demo=true; render(); }
  else if(a==="demo-off"){ S.demo=false; render(); }
  else if(a==="copy-report") copyText(reportText());
  else if(a==="chat-send") chatSend();
  else if(a==="chat-sug") chatSend(t.dataset.q);
  else if(a==="chat-stop") S.chatCtl?.abort();
  else if(a==="chat-clear"){ S.chat[S.ecoPv]={turns:[],view:[]}; updateChat(); }
  else if(a==="att-rm"){ S.chatAtt.splice(+t.dataset.i,1); updateChat(); }
  else if(a==="cap-go") genCaption();
  else if(a==="cap-copy") copyText($("#cap-"+t.dataset.k).innerText);
  else if(a==="fb-save"){
    const v=$("#fb-text").value.trim(); if(!v) return; const pv=pvById(S.pv);
    const regras=(pv.regras||"").trim()+`\n${v}${/[.!?]$/.test(v)?"":"."} (feedback de ${fmtDate(todayISO())})`;
    await savePv({...pv,regras}); $("#fb-text").value=""; toast("Regra adicionada.");
  }
  else if(a==="tpl"){
    const csv="data;porta_voz;canal;link;legenda;formato;tipo;curtidas;comentarios;compartilhamentos;impressoes\n";
    if(downloads){ try{ await downloads.save({filename:"modelo-base-posts.csv",data:"﻿"+csv}); }catch(_){ copyText(csv); } } else copyText(csv);
  }
  else if(a==="imp-save") saveImport();
  else if(a==="imp-cancel"){ S.imp=null; render(); }
  else if(a==="classify") classifyMissing();
  else if(a==="del-post"){ if(t.dataset.confirm){ await db?.collection("posts").doc(t.dataset.id).delete(); toast("Post excluído."); } else { t.dataset.confirm="1"; t.textContent="Confirmar"; } }
  else if(a==="mat-del"){ if(t.dataset.confirm){ await db?.collection("materiais").doc(t.dataset.id).delete(); toast("Material excluído."); } else { t.dataset.confirm="1"; t.textContent="Confirmar exclusão"; } }
  else if(a==="mat-paste"){
    const titulo=$("#mat-titulo").value.trim()||"Texto colado", texto=$("#mat-texto").value.trim(); if(!texto||!db) return;
    await db.collection("materiais").add({pv:$("#mat-pv").value,tipo:$("#mat-tipo").value,titulo,texto:texto.slice(0,100000),criadoEm:new Date().toISOString()}); toast("Texto salvo.");
  }
  else if(a==="regras-save"){
    if(!db) return toast("Base indisponível.");
    try{ await db.doc("config/regras").set({texto:$("#regras-gerais").value.trim()}); await savePv({...pvById(S.pv),regras:$("#regras-pv").value.trim()}); toast("Regras salvas."); }
    catch(_){ toast("Não foi possível salvar. Verifique se você tem acesso de edição."); }
  }
  else if(a==="pv-add"){
    const nome=$("#np-nome").value.trim(); if(!nome) return toast("Informe o nome.");
    const id=norm(nome).split(/\s+/).pop().replace(/[^a-z0-9]/g,"")+"-"+hash(nome).slice(0,4);
    await savePv({id,nome,cargo:$("#np-cargo").value.trim(),cliente:$("#np-cliente").value.trim(),regras:"",ordem:S.pvs.length+1}); toast(`${nome} adicionado.`);
  }
});
async function savePv(p){ if(!db) return toast("Base indisponível."); const {id,...rest}=p; await db.collection("portavozes").doc(id).set(rest); }
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="pv"){ S.pv=t.value; S.cap.result=null; S.chatAtt=[]; savePrefs(); render(); }
  else if(t.id==="periodo"){ S.periodo=t.value; if(t.value==="custom"&&!S.de){ S.de=addDays(todayISO(),-89); S.ate=todayISO(); } savePrefs(); render(); }
  else if(t.id==="de"||t.id==="ate"){ S[t.id]=t.value; savePrefs(); render(); }
  else if(t.id==="metric-sel"){ S.metric=t.value; render(); }
  else if(t.id==="rank-metric"){ S.rankMetric=t.value; render(); }

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="cap-tema") S.cap.tema=t.value; if(t.id==="cap-ctx") S.cap.contexto=t.value;

document.addEventListener("keydown",e=>{
  if(e.target.id==="chat-input"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); chatSend(); }
  if(e.key==="Escape"&&S.ecoOpen) closeEco();
  if((e.target.id==="imp-drop"||e.target.id==="mat-drop")&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); $(e.target.id==="imp-drop"?"#imp-file":"#mat-file").click(); }
});
function afterRender(){
  for(const [dz,inp,fn] of [["#imp-drop","#imp-file",f=>handleImport(f[0])],["#mat-drop","#mat-file",f=>addMaterials(f)]]){
    const d=$(dz); if(!d) continue;
    d.onclick=()=>$(inp).click();
    d.ondragover=ev=>{ev.preventDefault(); d.classList.add("over");};
    d.ondragleave=()=>d.classList.remove("over");
    d.ondrop=ev=>{ev.preventDefault(); d.classList.remove("over"); if(ev.dataTransfer.files.length) fn([...ev.dataTransfer.files]);};
  }
}

window.addEventListener("hashchange",route);
route();
(async()=>{
  if(!window.claude||!claude.use){ S.dbState="off"; S.sampleOk=false; render(); return; }
  const [d,s,dl]=await Promise.all([claude.use("db"),claude.use("sample"),claude.use("downloads")]);
  db=d; sample=s; downloads=dl;
  if(sample){ try{ const lim=await sample.limits(); S.toolsOk=!!lim.tools; S.imagesOk=!!lim.images; S.sampleOk=true; }catch(_){ S.sampleOk=true; } } else S.sampleOk=false;
  if(!db){ S.dbState="off"; render(); return; }
  const timer=setTimeout(()=>{ if(S.dbState==="loading"){ S.dbState="slow"; render(); } },10000);
  const done=()=>{ clearTimeout(timer); if(S.dbState!=="ok"){ S.dbState="ok"; } };
  let pending=null; const rerender=()=>{ if(pending) return; pending=requestAnimationFrame(()=>{ pending=null; if(S.ecoOpen) updateChat(); if(!(document.activeElement&&/^(cap-|regras-|mat-|np-|fb-|de$|ate$)/.test(document.activeElement.id))) render(); }); };
  db.collection("posts").onSnapshot(snap=>{ S.posts=snap.docs.map(x=>({id:x.id,...x.data()})); if(!snap.metadata.fromCache) done(); rerender(); }, ()=>{ S.dbState="off"; render(); });
  db.collection("materiais").onSnapshot(snap=>{ S.materiais=snap.docs.map(x=>({id:x.id,...x.data()})); rerender(); }, ()=>{});
  db.collection("portavozes").onSnapshot(snap=>{ if(snap.docs.length){ S.pvs=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.ordem||99)-(b.ordem||99)); const h=decodeURIComponent(location.hash.slice(1)); if((S.view==='home'||S.view==='splash')&&pvById(h)){ S.view='pv'; S.pv=h; } } rerender(); }, ()=>{});
  db.doc("config/regras").onSnapshot(snap=>{ if(snap.exists&&snap.data().texto) S.regrasGerais=snap.data().texto; rerender(); }, ()=>{});
})();
